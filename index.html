<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Online — Ajedrez, Un0 &amp; Blackjack</title>
    <meta name="description" content="Juega Ajedrez, Un0 y Blackjack online o contra la IA. Multijugador en tiempo real con tus amigos.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/uno.css" id="uno-css" disabled>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Si algo falla, el motivo exacto aparece abajo en pantalla
        window.addEventListener('error', function (e) {
            if (!e.message) return;
            var b = document.getElementById('error-banner');
            if (!b) { b = document.createElement('div'); b.id = 'error-banner'; document.body.appendChild(b); }
            b.textContent = 'Error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ')';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

<body>
    <header>
        <h1 id="main-title">Sala de Juegos</h1>
        <p id="main-subtitle">Elige tu juego y modo — IA, Local u Online</p>
    </header>

    <div class="main-layout">
        <aside class="controls-panel">
            <div class="form-group">
                <label for="player-name">Tu nombre</label>
                <input type="text" id="player-name" value="Jugador 1" maxlength="20">
            </div>
            <div class="form-group" id="player2-group" style="display: none;">
                <label for="player2-name">Nombre del segundo jugador</label>
                <input type="text" id="player2-name" value="Jugador 2" maxlength="20">
            </div>
            <div class="form-group">
                <label for="game-select">Juego</label>
                <select id="game-select">
                    <option value="chess">Ajedrez</option>
                    <option value="uno">Un0 Extra Supreme("alpha")</option>
                    <option value="blackjack">Blackjack</option>
                </select>
            </div>
            <div class="form-group">
                <label for="mode-select">Modo de juego</label>
                <select id="mode-select">
                    <option value="ai">Vs. Bot</option>
                    <option value="local">Vs. Humano (Local)</option>
                    <option value="online">Online</option>
                </select>
            </div>
            <div class="network-panel" id="network-panel" style="display: none;">
                <label for="my-peer-id">Tu código (compártelo con tu rival)</label>
                <input type="text" id="my-peer-id" readonly>
                <label for="remote-peer-id">Código de tu rival</label>
                <input type="text" id="remote-peer-id" placeholder="Pega aquí el ID del rival">
                <button id="connect-btn" type="button">Conectar</button>
            </div>
            <div class="form-group" id="difficulty-group">
                <label for="difficulty-select">Dificultad del Bot</label>
                <select id="difficulty-select">
                    <option value="learn">Aprendiz (al azar)</option>
                    <option value="easy">Fácil</option>
                    <option value="normal"selected >Normal</option>
                    <option value="hard">Difícil</option>
                    <option value="champ" >Leyenda</option>
                </select>
            </div>
            <div class="form-group" id="timer-config-group">
                <label for="timer-select">Tiempo por jugador</label>
                <select id="timer-select">
                    <option value="0">Sin límite</option>
                    <option value="60">1 minuto</option>
                    <option value="180">3 minutos</option>
                    <option value="300">5 minutos</option>
                    <option value="600">10 minutos</option>
                    <option value="custom">Personalizado...</option>
                </select>
                <div class="timer-custom-box" id="timer-custom-group" style="display: none;">
                    <div class="timer-custom-field"><input type="number" id="timer-custom-min" min="0" max="99" step="1"
                            value="2" aria-label="Minutos"><span>min</span></div>
                    <div class="timer-custom-field"><input type="number" id="timer-custom-sec" min="0" max="59" step="1"
                            value="30" aria-label="Segundos"><span>seg</span></div>
                </div>
            </div>
            <div class="switch-container" id="tutorial-switch-group">
                <span>Mostrar ayuda de piezas</span>
                <label class="switch">
                    <input type="checkbox" id="tutorial-switch">
                    <span class="slider"></span>
                </label>
            </div>
            <!-- Config específica de UNO (visible solo cuando game=uno) -->
            <div class="form-group" id="uno-players-group" style="display:none">
                <label for="uno-player-count">Nº de jugadores (2–10)</label>
                <input type="number" id="uno-player-count" min="2" max="10" value="4">
            </div>
            <button id="start-btn" type="button">Iniciar / Reiniciar Juego</button>
            <div class="scoreboard">
                <div class="score-box">
                    <div id="p1-label">Jugador 1</div>
                    <div class="score-value" id="p1-score">0</div>
                </div>
                <div class="score-box">
                    <div id="p2-label">Bot</div>
                    <div class="score-value" id="p2-score">0</div>
                </div>
            </div>
        </aside>

        <main class="game-panel" id="chess-panel">
            <div class="objective-card">
                <h2>Objetivo del juego</h2>
                <p id="objective-text"></p>
                <ul id="objective-steps"></ul>
            </div>
            <div class="status-msg" id="status-msg"></div>
            <div class="timer-display" id="timer-display" style="display: none;">
                <div class="timer-box"><small id="p1-timer-name"></small><span id="p1-timer">00:00</span></div>
                <div class="timer-box"><small id="p2-timer-name"></small><span id="p2-timer">00:00</span></div>
            </div>
            <div id="board-container"></div>
        </main>

        <!-- Panel UNO embebido (oculto cuando se juega ajedrez) -->
        <main class="game-panel" id="uno-panel" style="display:none; padding:0; overflow:hidden; min-height:600px; position:relative;">
            <iframe id="uno-frame"
                    src="uno.html"
                    style="width:100%;height:100%;min-height:620px;border:none;border-radius:10px;"
                    title="Un0 Extra Supreme">
            </iframe>
        </main>

        <!-- Panel Blackjack embebido (mesa de casino con fichas virtuales) -->
        <main class="game-panel" id="bj-panel" style="display:none; padding:0; overflow:hidden; min-height:720px; position:relative; grid-column: 2 / -1;">
            <iframe id="bj-frame"
                    src="blackjack.html"
                    style="width:100%;height:calc(100vh - 125px);min-height:720px;border:none;border-radius:10px;"
                    title="Blackjack">
            </iframe>
        </main>

        <aside class="info-side-panel">
            <div class="tutorial-card" id="tutorial-card">
                <h3 id="piece-info-title"></h3>
                <p id="piece-info-desc"></p>
                <p><strong>¿Cómo se mueve?</strong> <span id="piece-info-movement"></span></p>
            </div>
            <div class="history-container">
                <div class="history-title">Historial de movimientos</div>
                <div class="mini-wrap">
                    <div class="mini-board" id="mini-board"></div>
                    <div class="mini-nav">
                        <button type="button" onclick="miniStep(-1)" aria-label="Movimiento anterior">&#9664;</button>
                        <button type="button" onclick="miniStep(1)" aria-label="Movimiento siguiente">&#9654;</button>
                    </div>
                    <div id="mini-caption"></div>
                </div>
                <div class="history-grid" id="history-grid"></div>
            </div>
            <div class="captured-box" id="captured-box"></div>
        </aside>
    </div>

    <div id="win-card" class="win-overlay">
        <div class="win-explanation-card">
            <h3 id="win-title"></h3>
            <p id="win-reason"></p>
            <button id="quick-restart-btn" type="button">Reinicio rápido</button>
            <button id="win-close-btn" type="button" class="secondary">Ver tablero</button>
        </div>
    </div>

    <script src="js/confetti.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chess.js"></script>
    <script src="js/ice-config.js"></script>
    <script src="js/network.js"></script>
    <script src="js/main.js"></script>
    <script>
    // ===== INTEGRACIÓN DE JUEGOS EN IFRAME (Un0 y Blackjack) =====
    (function () {
        const gameSelect = document.getElementById('game-select');
        const modeSelect = document.getElementById('mode-select');
        const chessPanel = document.getElementById('chess-panel');
        const unoPanel   = document.getElementById('uno-panel');
        const bjPanel    = document.getElementById('bj-panel');
        const unoFrame   = document.getElementById('uno-frame');
        const bjFrame    = document.getElementById('bj-frame');
        const infoPanel  = document.querySelector('.info-side-panel');
        const unoCss     = document.getElementById('uno-css');
        const timerGroup = document.getElementById('timer-config-group');
        const tutGroup   = document.getElementById('tutorial-switch-group');
        const diffGroup  = document.getElementById('difficulty-group');
        const unoPlayersGroup = document.getElementById('uno-players-group');
        const mainTitle  = document.getElementById('main-title');
        const mainSub    = document.getElementById('main-subtitle');

        const TEXTS = {
            chess:     { title: 'Ajedrez Online', sub: 'Juega contra el Bot o con un amigo en línea' },
            uno:       { title: 'Un0 Extra Supreme("alpha")', sub: 'Juega Un0 con Bots o con amigos en línea' },
            blackjack: { title: 'Blackjack', sub: 'Mesa de casino con fichas virtuales: solo o con amigos en línea' }
        };

        function playerName() {
            return (document.getElementById('player-name').value || 'Jugador 1').trim().slice(0, 12);
        }

        function switchGame() {
            const game = gameSelect.value;
            const mode = modeSelect.value;
            const isUno = game === 'uno';
            const isBj  = game === 'blackjack';
            const isChess = !isUno && !isBj;

            // Paneles principales
            chessPanel.style.display = isChess ? '' : 'none';
            unoPanel.style.display   = isUno ? 'flex' : 'none';
            bjPanel.style.display    = isBj ? 'flex' : 'none';
            if (infoPanel) infoPanel.style.display = isChess ? '' : 'none';
            unoCss.disabled = !isUno;

            // Controles propios de cada juego
            if (timerGroup) timerGroup.style.display = isChess ? '' : 'none';
            if (tutGroup)   tutGroup.style.display   = isChess ? '' : 'none';
            if (diffGroup)  diffGroup.style.display  = isUno && mode === 'ai' ? 'flex' : (isChess ? '' : 'none');
            if (unoPlayersGroup) unoPlayersGroup.style.display = isUno ? 'flex' : 'none';

            // Título
            const t = TEXTS[game] || TEXTS.chess;
            mainTitle.textContent = t.title;
            mainSub.textContent = t.sub;

            // Al cambiar a un juego en iframe: comunicar la configuración
            if (isUno) sendConfigToUno();
            if (isBj)  sendConfigToBj();
        }

        function sendConfigToUno() {
            const mode  = modeSelect.value;
            const count = parseInt(document.getElementById('uno-player-count').value) || 4;
            const diff  = document.getElementById('difficulty-select').value;
            const msg = { type: 'UNO_CONFIG', name: playerName(), count, difficulty: diff, mode };
            if (unoFrame && unoFrame.contentWindow) unoFrame.contentWindow.postMessage(msg, '*');
        }

        function sendConfigToBj() {
            // "Vs. Humano (Local)" no aplica al Blackjack: se juega en solitario con la mesa
            const mode = modeSelect.value === 'online' ? 'online' : 'solo';
            if (bjFrame && bjFrame.contentWindow) bjFrame.contentWindow.postMessage({ type: 'BJ_CONFIG', name: playerName(), mode }, '*');
        }

        // Botón iniciar
        document.getElementById('start-btn').addEventListener('click', function () {
            if (gameSelect.value === 'uno') {
                sendConfigToUno();
                if (unoFrame && unoFrame.contentWindow) unoFrame.contentWindow.postMessage({ type: 'UNO_START' }, '*');
            } else if (gameSelect.value === 'blackjack') {
                sendConfigToBj();
                if (bjFrame && bjFrame.contentWindow) bjFrame.contentWindow.postMessage({ type: 'BJ_START' }, '*');
            }
        });

        // Mensajes que llegan de los iframes
        window.addEventListener('message', function (e) {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'UNO_READY' && gameSelect.value === 'uno') sendConfigToUno();
            if (e.data.type === 'BJ_READY'  && gameSelect.value === 'blackjack') sendConfigToBj();
            if (e.data.type === 'UNO_NEED_PEER') {
                const code = document.getElementById('my-peer-id').value;
                if (unoFrame && unoFrame.contentWindow) unoFrame.contentWindow.postMessage({ type: 'UNO_PEER_CODE', code }, '*');
            }
        });

        gameSelect.addEventListener('change', switchGame);
        modeSelect.addEventListener('change', function () {
            if (typeof refreshPanels === 'function') refreshPanels();
            switchGame();
        });
        document.getElementById('player-name').addEventListener('change', function () {
            if (gameSelect.value === 'blackjack') sendConfigToBj();
            if (gameSelect.value === 'uno') sendConfigToUno();
        });

        // Init
        switchGame();
    }());
    </script>
</body>

</html>
